<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- App Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <!-- Inner Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#ffffff" stroke-width="6" stroke-opacity="0.25" stroke-dasharray="8 8" />
  
  <!-- Steaming Rice Bowl & Utensils Icon -->
  <g filter="url(#shadow)" transform="translate(256, 270)">
    <!-- Bowl Base -->
    <path d="M -110,-20 C -100,80 100,80 110,-20 Z" fill="#ffffff" />
    <ellipse cx="0" cy="-20" rx="110" ry="24" fill="url(#gold)" />
    <!-- Rice mound -->
    <path d="M -90,-20 Q 0,-70 90,-20 Z" fill="#ffffff" />
    <!-- Bowl Foot -->
    <rect x="-40" y="65" width="80" height="15" rx="5" fill="#e2e8f0" />
    
    <!-- Steam waves -->
    <path d="M -40,-90 Q -25,-120 -40,-150" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-opacity="0.85" />
    <path d="M 0,-100 Q 15,-130 0,-165" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-opacity="0.95" />
    <path d="M 40,-90 Q 55,-120 40,-150" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-opacity="0.85" />
  </g>
  <!-- Sparkling Stars -->
  <path d="M 370,120 L 378,138 L 396,146 L 378,154 L 370,172 L 362,154 L 344,146 L 362,138 Z" fill="#fef08a" />
  <path d="M 130,150 L 135,162 L 147,167 L 135,172 L 130,184 L 125,172 L 113,167 L 125,162 Z" fill="#fef08a" />
</svg>
