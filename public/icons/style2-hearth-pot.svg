<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="potClay" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E05A36" />
      <stop offset="100%" stop-color="#C44725" />
    </linearGradient>
    <linearGradient id="lidClay" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <linearGradient id="steamGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="clayShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#7C2D12" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- Squircle Canvas (Warm Clay Ivory) -->
  <rect width="512" height="512" rx="112" fill="#FAF7F2" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#EAE2D5" stroke-width="4" stroke-opacity="0.8" />

  <!-- Steam Waves (Rising Harmony) -->
  <g fill="none" stroke="url(#steamGold)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left Steam -->
    <path d="M 204 165 C 190 145 186 120 200 98 C 214 76 198 56 186 64" stroke-width="10" />
    <!-- Center Hero Steam -->
    <path d="M 256 150 C 274 125 270 95 252 74 C 236 54 252 36 266 42" stroke-width="13" />
    <!-- Right Steam -->
    <path d="M 308 165 C 322 145 326 120 312 98 C 298 76 314 56 326 64" stroke-width="10" />
  </g>

  <!-- Clay Pot Body & Lid -->
  <g filter="url(#clayShadow)">
    <!-- Twin Handles -->
    <path d="M 120 286 C 96 286 96 342 120 342 Z" fill="#B43818" />
    <path d="M 392 286 C 416 286 416 342 392 342 Z" fill="#B43818" />

    <!-- Pot Basin -->
    <path 
      d="M 140 268 C 136 360 176 412 256 412 C 336 412 376 360 372 268 Z" 
      fill="url(#potClay)" 
    />
    <!-- Pot Collar Rim -->
    <rect x="132" y="252" width="248" height="24" rx="12" fill="#A83215" />
    
    <!-- Pot Lid -->
    <path 
      d="M 152 252 C 160 216 210 200 256 200 C 302 200 352 216 360 252 Z" 
      fill="url(#lidClay)" 
    />
    <!-- Lid Knob (Golden Saffron Brass) -->
    <circle cx="256" cy="190" r="18" fill="#F59E0B" />
    <circle cx="256" cy="186" r="12" fill="#FDE68A" />

    <!-- Organic Highlight Arc -->
    <path 
      d="M 164 290 C 160 320 170 356 182 370" 
      fill="none" 
      stroke="#FFD5C8" 
      stroke-width="8" 
      stroke-linecap="round" 
      stroke-opacity="0.7" 
    />
  </g>
</svg>
