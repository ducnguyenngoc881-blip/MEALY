<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="mGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1A1918" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Squircle Canvas (Ceramic Warm Rice) -->
  <rect width="512" height="512" rx="112" fill="#FAF8F5" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#E8E2D8" stroke-width="4" stroke-opacity="0.6" />

  <!-- Monogram Glyph & Ceramic Bowl -->
  <g filter="url(#softGlow)" transform="translate(0, 8)">
    <!-- Ceramic Bowl Base Silhouette -->
    <path 
      d="M 136 250 C 136 348 200 400 256 400 C 312 400 376 348 376 250 L 328 250 C 328 322 284 358 256 358 C 228 358 184 322 184 250 Z" 
      fill="#1A1918" 
    />
    <!-- Bowl Foot Stand -->
    <rect x="216" y="406" width="80" height="16" rx="8" fill="#1A1918" />

    <!-- Geometric "M" Interlocking into Bowl -->
    <!-- Left Pillar -->
    <rect x="160" y="160" width="36" height="168" rx="8" fill="#1A1918" />
    <!-- Center Chevrons (Gold Saffron) -->
    <path 
      d="M 196 160 L 256 268 L 316 160 L 316 208 L 256 316 L 196 208 Z" 
      fill="url(#mGrad)" 
    />
    <!-- Right Pillar -->
    <rect x="316" y="160" width="36" height="168" rx="8" fill="#1A1918" />

    <!-- Rising Steam / Herbal Sprout Leaf -->
    <path 
      d="M 368 180 C 368 140 404 128 404 128 C 404 128 400 164 376 182 C 370 186 368 184 368 180 Z" 
      fill="url(#mGrad)" 
    />
    <path 
      d="M 370 148 Q 386 156 392 142" 
      fill="none" 
      stroke="#FAF8F5" 
      stroke-width="3" 
      stroke-linecap="round" 
    />
    <circle cx="360" cy="204" r="5" fill="url(#mGrad)" />
  </g>
</svg>
