<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 230" width="100%" height="100%" role="img" aria-label="NEXS Technologies Var 4 - Interlocking Hex Loop">
  <g id="var4-lockup" transform="translate(15, 15)">
    <!-- SYMBOL: Two Thick Interlocking Links (Blue + Yellow) -->
    <g id="symbol-v4" transform="translate(10, 0)">
      <!-- Outer Hexagon Frame -->
      <path d="M 90,12 L 164,54.7 L 164,140 L 90,182.7 L 16,140 L 16,54.7 Z" 
            fill="none" 
            stroke="#222D64" 
            stroke-width="20" 
            stroke-linejoin="round" />

      <!-- Left Link (Solid Royal Blue #222D64) -->
      <path d="M 68,58 L 52,74 L 52,120 L 76,144 L 92,128 L 92,112 L 80,100 L 72,108 L 72,82 L 80,74 L 92,86 L 92,70 Z" 
            fill="#222D64" />

      <!-- Right Link (Solid Golden Yellow #FFC330 - Intertwined) -->
