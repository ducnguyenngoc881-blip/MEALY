<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 230" width="100%" height="100%" role="img" aria-label="NEXS Technologies Var 7 - Signature X-Core">
  <g id="var7-lockup" transform="translate(15, 15)">
