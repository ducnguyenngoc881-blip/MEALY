<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 240" width="100%" height="100%" role="img" aria-label="NEXS Technologies Option 3 - Isometric Nexus">
  <defs>
    <linearGradient id="opt3-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18214D" />
      <stop offset="100%" stop-color="#222D64" />
    </linearGradient>
    <linearGradient id="opt3-yellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD459" />
      <stop offset="100%" stop-color="#FFC330" />
    </linearGradient>
    <linearGradient id="opt3-yellow-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB300" />
      <stop offset="100%" stop-color="#E59D00" />
    </linearGradient>
    <filter id="opt3-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#222D64" flood-opacity="0.14" />
    </filter>
  </defs>

  <g id="option-3-lockup" transform="translate(20, 20)">
    <!-- SYMBOL: Isometric N-T Ribbon within Hexagon -->
    <g id="symbol-isometric-nexus" transform="translate(10, 0)" filter="url(#opt3-shadow)">
      <!-- Outer Hexagon Baseline Geometry (Light guide/frame) -->
      <path d="M 90,10 L 165,53.3 L 165,140 L 90,183.3 L 15,140 L 15,53.3 Z" 
            fill="none" 
            stroke="#222D64" 
            stroke-width="12" 
            stroke-linejoin="round" />

      <!-- Left N-Stem (Royal Blue) -->
      <polygon points="35,65 57,52 57,142 35,129" fill="#222D64" />
      
      <!-- Diagonal N-Band crossing down to center -->
      <polygon points="57,68 82,108 64,124 39,83" fill="#1C2554" />

      <!-- Isometric Yellow Fold Facet (Center Dimension) -->
      <polygon points="80,75 98,65 98,138 80,128" fill="url(#opt3-yellow)" />
      <!-- Shadow Under-facet on fold -->
      <polygon points="73,115 80,128 80,75 73,85" fill="url(#opt3-yellow-dark)" />

      <!-- Right T-Crossbar & Stem (Royal Blue) -->
      <polygon points="98,65 145,65 145,83 118,83 118,138 98,138" fill="#222D64" />

      <!-- Outer Return Loop / Tech Continuity Hook -->
      <polygon points="145,83 145,125 125,137 125,120 133,115 133,83" fill="#222D64" />
    </g>

    <!-- WORDMARK & SLOGAN -->
    <g id="typography-group" transform="translate(225, 20)">
      <!-- NEXS Brandname -->
      <g id="wordmark-nexs">
        <!-- N -->
        <path d="M 0,85 L 0,15 L 20,15 L 52,60 L 52,15 L 72,15 L 72,85 L 52,85 L 20,40 L 20,85 Z" fill="#222D64" />
        <!-- E -->
        <path d="M 88,85 L 88,15 L 150,15 L 150,31 L 108,31 L 108,43 L 146,43 L 146,58 L 108,58 L 108,70 L 152,70 L 152,85 Z" fill="#222D64" />
        <!-- X with Yellow Facet -->
        <path d="M 166,15 L 188,15 L 236,85 L 214,85 Z" fill="#222D64" />
        <path d="M 215,15 L 236,15 L 208,54 L 190,43 Z" fill="#222D64" />
        <path d="M 183,54 L 163,85 L 184,85 L 200,60 Z" fill="#222D64" />
        <polygon points="198,43 209,43 202,54 191,54" fill="url(#opt3-yellow)" />
        <!-- S -->
        <path d="M 252,72 C 258,81 269,87 284,87 C 298,87 308,79 308,68 C 308,57 298,52 282,49 C 259,44 244,37 244,21 C 244,7 258,-1 280,-1 C 296,-1 310,6 317,17 L 302,28 C 296,20 288,15 279,15 C 268,15 262,20 262,27 C 262,35 270,40 286,43 C 311,48 326,55 326,73 C 326,90 310,100 284,100 C 264,100 248,91 238,77 Z" transform="translate(0, -5)" fill="#222D64" />
      </g>

      <!-- Descriptor: TECHNOLOGIES -->
      <g id="descriptor" transform="translate(4, 116)">
        <text font-family="'Reddit Sans', 'Inter', sans-serif" font-size="19" font-weight="700" letter-spacing="0.32em" fill="#222D64">
          TECHNOLOGIES
        </text>
        <rect x="335" y="-7" width="90" height="3.5" rx="1.75" fill="url(#opt3-yellow)" />
      </g>

      <!-- Vietnamese Slogan: Growth & Sustainable Tech -->
      <g id="slogan" transform="translate(4, 146)">
        <text font-family="'Reddit Sans', 'Inter', sans-serif" font-size="13.5" font-weight="600" letter-spacing="0.12em" fill="#5A6588">
          CÔNG NGHỆ DẪN ĐẦU • PHÁT TRIỂN BỀN VỮNG
        </text>
      </g>
    </g>
  </g>
</svg>
