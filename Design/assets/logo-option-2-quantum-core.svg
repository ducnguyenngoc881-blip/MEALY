<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 240" width="100%" height="100%" role="img" aria-label="NEXS Technologies Option 2 - Quantum Core">
  <defs>
    <linearGradient id="opt2-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18214D" />
      <stop offset="100%" stop-color="#222D64" />
    </linearGradient>
    <linearGradient id="opt2-yellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD459" />
      <stop offset="100%" stop-color="#FFC330" />
    </linearGradient>
    <filter id="opt2-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#222D64" flood-opacity="0.14" />
    </filter>
  </defs>

  <g id="option-2-lockup" transform="translate(20, 20)">
    <!-- SYMBOL: Quantum AI Core Hexagon -->
    <g id="symbol-quantum-core" transform="translate(10, 0)" filter="url(#opt2-shadow)">
      <!-- Outer Hexagon Perimeter -->
      <path d="M 90,10 L 165,53.3 L 165,140 L 90,183.3 L 15,140 L 15,53.3 Z" 
            fill="none" 
            stroke="#222D64" 
            stroke-width="15" 
            stroke-linejoin="round" 
            stroke-linecap="round" />
      
      <!-- 6 Radiating Circuit Traces -->
      <!-- Top to Center -->
      <line x1="90" y1="28" x2="90" y2="60" stroke="#222D64" stroke-width="8" stroke-linecap="round" />
      <!-- Bottom to Center -->
      <line x1="90" y1="134" x2="90" y2="166" stroke="#222D64" stroke-width="8" stroke-linecap="round" />
      <!-- Top-Right to Center -->
      <line x1="148" y1="63" x2="118" y2="80" stroke="#222D64" stroke-width="8" stroke-linecap="round" />
      <!-- Bottom-Right to Center -->
      <line x1="148" y1="130" x2="118" y2="113" stroke="#222D64" stroke-width="8" stroke-linecap="round" />
      <!-- Top-Left to Center -->
      <line x1="32" y1="63" x2="62" y2="80" stroke="#222D64" stroke-width="8" stroke-linecap="round" />
      <!-- Bottom-Left to Center -->
      <line x1="32" y1="130" x2="62" y2="113" stroke="#222D64" stroke-width="8" stroke-linecap="round" />

      <!-- Center Hexagonal Processor Unit (Golden Yellow #FFC330) -->
      <polygon points="90,65 118,81 118,113 90,129 62,113 62,81" 
               fill="url(#opt2-yellow)" 
               stroke="#222D64" 
               stroke-width="4" />
      
      <!-- Internal Microchip Die -->
      <rect x="80" y="87" width="20" height="20" rx="3" fill="#222D64" />
      <circle cx="90" cy="97" r="3.5" fill="#FFFFFF" />
    </g>

    <!-- WORDMARK & SLOGAN -->
    <g id="typography-group" transform="translate(225, 20)">
      <!-- NEXS Brandname -->
      <g id="wordmark-nexs">
        <!-- N -->
        <path d="M 0,85 L 0,15 L 20,15 L 52,60 L 52,15 L 72,15 L 72,85 L 52,85 L 20,40 L 20,85 Z" fill="#222D64" />
        <!-- E -->
        <path d="M 88,85 L 88,15 L 150,15 L 150,31 L 108,31 L 108,43 L 146,43 L 146,58 L 108,58 L 108,70 L 152,70 L 152,85 Z" fill="#222D64" />
        <!-- X with Yellow Facet -->
        <path d="M 166,15 L 188,15 L 236,85 L 214,85 Z" fill="#222D64" />
        <path d="M 215,15 L 236,15 L 208,54 L 190,43 Z" fill="#222D64" />
        <path d="M 183,54 L 163,85 L 184,85 L 200,60 Z" fill="#222D64" />
        <polygon points="198,43 209,43 202,54 191,54" fill="url(#opt2-yellow)" />
        <!-- S -->
        <path d="M 252,72 C 258,81 269,87 284,87 C 298,87 308,79 308,68 C 308,57 298,52 282,49 C 259,44 244,37 244,21 C 244,7 258,-1 280,-1 C 296,-1 310,6 317,17 L 302,28 C 296,20 288,15 279,15 C 268,15 262,20 262,27 C 262,35 270,40 286,43 C 311,48 326,55 326,73 C 326,90 310,100 284,100 C 264,100 248,91 238,77 Z" transform="translate(0, -5)" fill="#222D64" />
      </g>

      <!-- Descriptor: TECHNOLOGIES -->
      <g id="descriptor" transform="translate(4, 116)">
        <text font-family="'Reddit Sans', 'Inter', sans-serif" font-size="19" font-weight="700" letter-spacing="0.32em" fill="#222D64">
          TECHNOLOGIES
        </text>
        <rect x="335" y="-7" width="90" height="3.5" rx="1.75" fill="url(#opt2-yellow)" />
      </g>

      <!-- Vietnamese Slogan: Technology Focused -->
      <g id="slogan" transform="translate(4, 146)">
        <text font-family="'Reddit Sans', 'Inter', sans-serif" font-size="13.5" font-weight="600" letter-spacing="0.12em" fill="#5A6588">
          TIÊN PHONG CÔNG NGHỆ • KIẾN TẠO TƯƠNG LAI
        </text>
      </g>
    </g>
  </g>
</svg>
