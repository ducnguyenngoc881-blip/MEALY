<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 230" width="100%" height="100%" role="img" aria-label="NEXS Technologies Var 8 - Dual Shield">
  <g id="var8-lockup" transform="translate(15, 15)">
    <!-- SYMBOL: Solid Geometric Shield Core inside Hexagon -->
    <g id="symbol-v8" transform="translate(10, 0)">
      <!-- Outer Hexagon Frame -->
      <path d="M 90,12 L 164,54.7 L 164,140 L 90,182.7 L 16,140 L 16,54.7 Z" 
            fill="none" 
            stroke="#222D64" 
            stroke-width="20" 
            stroke-linejoin="round" />

      <!-- Outer Shield Crest (Solid Royal Blue #222D64) -->
      <polygon points="90,44 140,68 140,118 90,152 40,118 40,68" fill="#1C2554" />

      <!-- Inner Shield (Solid Golden Yellow #FFC330) -->
      <polygon points="90,62 124,80 124,116 90,138 56,116 56,80" fill="#FFC330" />

      <!-- Shield Facet Shading (Right Half Shaded Yellow #E5A812) -->
      <polygon points="90,62 124,80 124,116 90,138" fill="#E5A812" />
      
      <!-- Core Monolith Notch (Solid White/Negative Space Diamond) -->
      <polygon points="90,84 102,96 90,108 78,96" fill="#1C2554" />
    </g>

    <!-- WORDMARK & SLOGAN -->
    <g id="typography-v8" transform="translate(225, 20)">
      <g id="wordmark-nexs">
        <path d="M 0,85 L 0,15 L 20,15 L 52,60 L 52,15 L 72,15 L 72,85 L 52,85 L 20,40 L 20,85 Z" fill="#222D64" />
        <path d="M 88,85 L 88,15 L 150,15 L 150,31 L 108,31 L 108,43 L 146,43 L 146,58 L 108,58 L 108,70 L 152,70 L 152,85 Z" fill="#222D64" />
        <path d="M 166,15 L 188,15 L 236,85 L 214,85 Z" fill="#222D64" />
        <path d="M 215,15 L 236,15 L 208,54 L 190,43 Z" fill="#222D64" />
        <path d="M 183,54 L 163,85 L 184,85 L 200,60 Z" fill="#222D64" />
        <polygon points="198,43 209,43 202,54 191,54" fill="#FFC330" />
        <path d="M 252,72 C 258,81 269,87 284,87 C 298,87 308,79 308,68 C 308,57 298,52 282,49 C 259,44 244,37 244,21 C 244,7 258,-1 280,-1 C 296,-1 310,6 317,17 L 302,28 C 296,20 288,15 279,15 C 268,15 262,20 262,27 C 262,35 270,40 286,43 C 311,48 326,55 326,73 C 326,90 310,100 284,100 C 264,100 248,91 238,77 Z" transform="translate(0, -5)" fill="#222D64" />
      </g>
      <g id="descriptor" transform="translate(4, 116)">
