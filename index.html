    <script>
      (function() {
        try {
          var saved = localStorage.getItem('mealwise_theme');
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}

        // Prevent mobile device system font scaling from distorting app layout
        function lockDeviceFontSize() {
          try {
            var docEl = document.documentElement;
            if (!docEl) return;
            var testDiv = document.createElement('div');
            testDiv.style.cssText = 'position:absolute;visibility:hidden;width:auto;height:auto;font-size:16px;line-height:1;margin:0;padding:0;top:-9999px;left:-9999px;';
            testDiv.innerText = 'M';
            (document.body || docEl).appendChild(testDiv);
            var computedSize = parseFloat(window.getComputedStyle(testDiv).fontSize);
            if (testDiv.parentNode) testDiv.parentNode.removeChild(testDiv);
            if (computedSize && Math.abs(computedSize - 16) > 0.4) {
              var scaleFactor = computedSize / 16;
              docEl.style.fontSize = (16 / scaleFactor) + 'px';
            }
          } catch (err) {}
        }

        lockDeviceFontSize();
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', lockDeviceFontSize);
        }
        window.addEventListener('resize', lockDeviceFontSize);
        window.addEventListener('pageshow', lockDeviceFontSize);
      })();
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          var isDev = location.port === '5173' || 
                      location.hostname === 'localhost' || 
                      location.hostname === '127.0.0.1' || 
                      location.hostname.includes('ngrok') || 
                      location.hostname.includes('loca.lt') || 
                      location.hostname.includes('trycloudflare.com') ||
                      location.search.includes('force_refresh=true');
          if (isDev) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              for (var reg of regs) {
                reg.unregister();
              }
            }).catch(function() {});
            if ('caches' in window) {
              caches.keys().then(function(keys) {
                keys.forEach(function(k) { caches.delete(k); });
              }).catch(function() {});
            }
          } else {
            navigator.serviceWorker.register('/sw.js').then(function(reg) {
              reg.update();
            }).catch(function() {});
          }
        });
      }
    </script>
  </head>
