<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#2563EB" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Mealy" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <title>Mealy - Hôm nay ăn gì? • Lên thực đơn tuần & Sổ tay công thức</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('mealwise_theme');
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}

        // Prevent mobile device system font scaling from distorting app layout
        function lockDeviceFontSize() {
          try {
            var docEl = document.documentElement;
            if (!docEl) return;
            var testDiv = document.createElement('div');
            testDiv.style.cssText = 'position:absolute;visibility:hidden;width:auto;height:auto;font-size:16px;line-height:1;margin:0;padding:0;top:-9999px;left:-9999px;';
            testDiv.innerText = 'M';
            (document.body || docEl).appendChild(testDiv);
            var computedSize = parseFloat(window.getComputedStyle(testDiv).fontSize);
            if (testDiv.parentNode) testDiv.parentNode.removeChild(testDiv);
            if (computedSize && Math.abs(computedSize - 16) > 0.4) {
              var scaleFactor = computedSize / 16;
              docEl.style.fontSize = (16 / scaleFactor) + 'px';
            }
          } catch (err) {}
        }

        lockDeviceFontSize();
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', lockDeviceFontSize);
        }
        window.addEventListener('resize', lockDeviceFontSize);
        window.addEventListener('pageshow', lockDeviceFontSize);
      })();
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          var isDev = location.port === '5173' || 
                      location.hostname === 'localhost' || 
                      location.hostname === '127.0.0.1' || 
                      location.hostname.includes('ngrok') || 
                      location.hostname.includes('loca.lt') || 
                      location.hostname.includes('trycloudflare.com') ||
                      location.search.includes('force_refresh=true');
          if (isDev) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              for (var reg of regs) {
                reg.unregister();
              }
            }).catch(function() {});
            if ('caches' in window) {
              caches.keys().then(function(keys) {
                keys.forEach(function(k) { caches.delete(k); });
              }).catch(function() {});
            }
          } else {
            navigator.serviceWorker.register('/sw.js').then(function(reg) {
              reg.update();
            }).catch(function() {});
          }
        });
      }
    </script>
  </head>
  <body class="bg-ceramic-50 text-stone-900 dark:bg-stone-950 dark:text-stone-100 font-sans antialiased selection:bg-amber-500 selection:text-stone-950 transition-colors duration-200">
    <div id="root">
      <div id="app-splash" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #FAF8F5; color: #1c1917; font-family: -apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif; padding: 20px; text-align: center;">
        <div style="width: 68px; height: 68px; border-radius: 20px; background: #0F172A; display: flex; align-items: center; justify-content: center; box-shadow: 0 12px 28px -6px rgba(37, 99, 235, 0.35); margin-bottom: 16px; animation: mw-pulse 1.8s ease-in-out infinite; overflow: hidden;">
          <svg width="58" height="58" viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M 94 38 C 93 21 105 11 121 11 C 122 27 110 38 94 38 Z" fill="#10B981" />
            <path d="M 24 29 C 21 29 20 38 24 39 L 136 50 C 138 50 138 46 136 45 Z" fill="#2563EB" />
            <path d="M 22 46 C 19 46 19 56 23 56 L 135 60 C 137 60 137 56 135 55 Z" fill="#2563EB" />
            <path d="M 27 76 C 27 112 48 132 58 136 L 59 144 C 59 146 61 148 64 148 L 96 148 C 99 148 101 146 101 144 L 102 136 C 112 132 133 112 133 76 L 126 76 C 124 106 105 125 80 125 C 55 125 36 106 34 76 Z" fill="#2563EB" />
            <path d="M 52 114 L 55 82 C 56 68 70 68 72 82 L 75 104 C 76 112 83 112 84 104 L 90 60 C 92 43 107 43 108 60 L 111 114" stroke="#0F172A" stroke-width="18" stroke-linecap="square" stroke-linejoin="round" />
            <path d="M 52 114 L 55 82 C 56 68 70 68 72 82 L 75 104 C 76 112 83 112 84 104 L 90 60 C 92 43 107 43 108 60 L 111 114" stroke="#FFFFFF" stroke-width="12.5" stroke-linecap="butt" stroke-linejoin="round" />
          </svg>
        </div>
        <h1 style="font-size: 19px; font-weight: 800; letter-spacing: -0.02em; margin: 0 0 6px 0; color: #1c1917;">Mealy • Mâm Cơm Việt</h1>
        <p style="font-size: 13px; color: #78716c; margin: 0 0 20px 0; font-weight: 500;">Đang khởi động thực đơn & nguyên liệu thông minh...</p>
        <div style="width: 140px; height: 4px; background: #e7e5e4; border-radius: 9999px; overflow: hidden; position: relative;">
          <div style="position: absolute; top: 0; left: 0; bottom: 0; width: 45%; background: #2563EB; border-radius: 9999px; animation: mw-load 1.2s ease-in-out infinite alternate;"></div>
        </div>
      </div>
      <style>
        @keyframes mw-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
        @keyframes mw-load { 0% { transform: translateX(-40%); } 100% { transform: translateX(260%); } }
        .dark #app-splash { background: #121110 !important; color: #fafaf9 !important; }
        .dark #app-splash h1 { color: #fafaf9 !important; }
        .dark #app-splash p { color: #a8a29e !important; }
        .dark #app-splash div[style*="background: #e7e5e4"] { background: #292524 !important; }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
